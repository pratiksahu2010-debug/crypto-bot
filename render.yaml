services:
  - type: web
    name: crypto-alt-alert-bot
    env: python
    plan: starter            # must be a PAID plan - free plans sleep and kill the scheduler
    healthCheckPath: /health
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn main:app --bind 0.0.0.0:$PORT --worker-class gthread --workers 1 --threads 4 --timeout 300"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: TELEGRAM_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: COINSWITCH_API_KEY
        sync: false
      - key: COINSWITCH_SECRET_KEY
        sync: false
